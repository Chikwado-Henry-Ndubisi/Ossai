<!DOCTYPE html><html><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>OSSAI</title><style>body{margin:0;font-family:Arial;background:#fffaf5}.top{background:#ff6b00;color:#fff;padding:28px;text-align:center;border-radius:0 0 28px 28px}.card{background:#fff;margin:14px;padding:18px;border-radius:16px;box-shadow:0 4px 12px rgba(0,0,0,.07)}input{width:94%;padding:14px;border:1px solid #ddd;border-radius:10px}button{background:#ff6b00;color:#fff;border:none;padding:15px;width:100%;border-radius:12px;font-weight:bold;margin-top:10px;font-size:16px}.week{text-align:center;font-size:40px;color:#ff6b00;font-weight:bold}</style></head><body><div class="top"><h1>OSSAI</h1><p>Pregnant Mothers Care - By Ossai</p></div><div class="card"><h3>🤰 How many weeks?</h3><input id="w" type="number" placeholder="e.g 16"><button onclick="saveW()">Save Week</button><div class="week" id="sw">Week: --</div></div><div class="card"><h3>💡 Today's Tip</h3><p>Drink water, eat fruits, rest 8hrs. Your baby is strong!</p></div><div class="card"><h3>🏥 Help</h3><button onclick="alert('Calling Nurse...')">📞 Call Nurse</button><button style="background:#111" onclick="alert('Emergency!')">🚨 Emergency</button></div><script>let s=localStorage.getItem('ossaiW');if(s)document.getElementById('sw').innerText='Week: '+s;function saveW(){let v=document.getElementById('w').value;if(!v)return;localStorage.setItem('ossaiW',v);document.getElementById('sw').innerText='Week: '+v;alert('OSSAI saved Week '+v)}</script></body></html>
