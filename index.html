*{margin:0;padding:0;box-sizing:border-box}
body{background:#4A2E7A;margin:0;font-family:sans-serif;overflow:hidden}

#splash{position:fixed;top:0;left:0;width:100%;height:100%;background:#4A2E7A;z-index:3000;display:flex;flex-direction:column;align-items:center;justify-content:center;transition:opacity 0.8s}
#splash img{width:1100px;height:1100px;max-width:88vw;max-height:60vh;object-fit:contain;background:transparent;border:none;animation:pop 1.2s ease}

.ads{position:fixed;left:0;width:100%;height:90px;background:#FFFFFF;z-index:1000;display:flex;align-items:center;justify-content:center}
.ads-top{top:0}
.ads-bot{bottom:0}
.ads b{color:#000;font-size:10px;font-weight:900}

/* GOLD COLOUR MOVING TEXTS - NOT YELLOW */
.marq{position:fixed;left:0;width:100%;height:65px;background:transparent;z-index:999;display:flex;align-items:center;overflow:hidden;white-space:nowrap}
.marq-top{top:90px}
.marq-bot{bottom:90px}

@keyframes slide{0%{transform:translateX(0)}100%{transform:translateX(-100%)}}

.center{height:100vh;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:170px 15px}
.center img{width:1100px;height:1100px;max-width:90vw;max-height:55vh;object-fit:contain;background:transparent !important;border:none !important;border-radius:0 !important;box-shadow:none !important}
.center h1{color:white;font-size:48px;font-weight:900;margin-top:10px}
.center p{color:#E9D5FF;font-size:18px;margin-bottom:20px;font-weight:700}
.btns{display:flex;flex-direction:column;align-items:center;gap:12px}
.btn{width:350px;max-width:86vw;padding:18px;border-radius:50px;border:none;font-weight:900;font-size:18px}
