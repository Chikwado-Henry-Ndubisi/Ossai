*{margin:0;padding:0;box-sizing:border-box}
body{background:#4A2D6E;width:100vw;height:100vh;overflow:hidden;font-family:Arial, sans-serif}
.bg{position:fixed;top:0;left:0;width:100vw;height:100vh;z-index:1}

.marq{position:fixed;left:0;width:100vw;height:70px;z-index:11;display:flex;align-items:center;overflow:hidden;white-space:nowrap;background:rgba(0,0,0,0.4)}
.marq-top{top:90px}.marq-bot{bottom:90px}
.marq b{color:#FFD700;font-size:40px;font-weight:900;animation:slide 15s linear infinite;padding-left:100%;letter-spacing:1px}

.content{position:fixed;top:0;left:0;width:100vw;height:100vh;z-index:12;display:flex;flex-direction:column;align-items:center;justify-content:flex-end;padding-bottom:11vh;text-align:center}
.content .logo-name{color:white;font-size:42px;font-weight:900;text-shadow:0 3px 10px black}

.btn-gold{background:#FFD700;color:#4A2D6E;box-shadow:0 6px 20px rgba(0,0,0,0.5)}
.btn-purple{background:#4A2D6E;color:white;border:3px solid white;box-shadow:0 6px 20px rgba(0,0,0,0.5)}

#splash{position:fixed;top:0;left:0;width:100vw;height:100vh;background:#4A2D6E;z-index:100;display:flex;flex-direction:column;align-items:center;justify-content:flex-end;padding-bottom:18vh;transition:opacity 0.8s}
#splash img{position:absolute;top:0;left:0;width:100vw;height:100vh;object-fit:cover}
#splash .t{position:relative;z-index:2;text-align:center}
#splash h1{color:white;font-size:48px;font-weight:900}

.loader{margin:22px auto 0;width:48px;height:48px;border:4px solid rgba(255,255,255,0.3);border-top:4px solid #FFD700;border-radius:50%;animation:spin 1s linear infinite}
