<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>OSSAI - Video Quotes</title>
<style>
body{margin:0;font-family:Arial;background:#000;overflow:hidden}
.vid{position:fixed;top:0;left:0;width:100%;height:100%;object-fit:cover;z-index:-1}
.overlay{position:fixed;top:0;left:0;width:100%;height:100%;background:linear-gradient(rgba(0,0,0,.3),rgba(255,107,0,.6));z-index:0}
.box{position:relative;z-index:1;height:100vh;display:flex;flex-direction:column;justify-content:center;align-items:center;padding:20px;text-align:center;color:#fff}
.q{font-size:32px;font-weight:bold;line-height:1.3;text-shadow:0 2px 10px #000;animation:pop 1s}
.a{margin-top:20px;font-size:18px;opacity:.9}
button{background:#fff;color:#ff6b00;border:none;padding:14px 28px;border-radius:30px;font-weight:bold;margin:10px;font-size:16px}
.nav{position:fixed;bottom:30px;left:0;width:100%;text-align:center;z-index:2}
.topbar{position:fixed;top:0;left:0;width:100%;padding:15px;background:rgba(0,0,0,.4);z-index:3;display:flex;justify-content:space-between;color:#fff}
@keyframes pop{0%{transform:scale(.8);opacity:0}100%{transform:scale(1);opacity:1}}
@keyframes float{0%{transform:translateY(0)}50%{transform:translateY(-10px)}100%{transform:translateY(0)}}
</style>
</head>
<body>
<video class="vid" autoplay muted loop playsinline>
<source src="https://cdn.coverr.co/videos/coverr-a-pregnant-woman-rubbing-her-belly-1572/1080p.mp4" type="video/mp4">
</video>
<div class="overlay"></div>
<div class="topbar"><span onclick="location.href='index.html'">⬅ OSSAI</span><span>Video Quotes</span></div>

<div class="box">
<div class="q" id="qt">Loading...</div>
<div class="a" id="at">- OSSAI</div>
<br><br>
<button onclick="nextQuote()">⏭ Next Video Quote</button>
<button onclick="shareQuote()">📤 Share</button>
</div>

<div class="nav">
<button onclick="location.href='index.html'" style="background:#ff6b00;color:#fff">🏠 Home</button>
</div>

<script>
const quotes=[
"🤰 Mama, you are stronger than you think. Your baby feels your love.",
"💖 Every kick is a reminder - a miracle is growing inside you.",
"🌸 Rest, Mama. You are doing an amazing job.",
"✨ God chose YOU to carry this beautiful soul. You are blessed.",
"🤱 Breathe in strength, breathe out fear. You and baby are safe.",
"🌟 Your body is not weak, Mama. It is creating life!",
"💪 Tough days don't last, but tough mamas do!",
"🙏 OSSAI is with you - Every week, Every step.",
"👶 Your baby's first home is your love. And you have plenty.",
"❤️ You are already the best mother in the world to your baby."
];
let i=0;
function showQ(){
document.getElementById('qt').style.animation='none';
setTimeout(()=>{
document.getElementById('qt').style.animation='pop 1s';
document.getElementById('qt').innerText=quotes[i];
},100);
}
function nextQuote(){i=(i+1)%quotes.length;showQ();}
function shareQuote(){
if(navigator.share){navigator.share({title:'OSSAI Quote',text:quotes[i]});}
else{alert(quotes[i]);}
}
showQ();
setInterval(nextQuote,7000); // Auto changes every 7 seconds = Auto Video Quotes!
</script>
</body>
</html>
